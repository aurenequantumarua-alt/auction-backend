services:
  - type: web
    name: auction-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma db push --skip-generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://auction-frontend-five-rose.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: PUBLIC_UPLOADS_BASE_URL
        value: https://auction-backend-bgkg.onrender.com/uploads
