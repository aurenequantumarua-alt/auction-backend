services:
  - type: web
    name: auction-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://auction-frontend-five-rose.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: PAYOUT_PROVIDER
        value: manual
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BANK_ENCRYPTION_KEY
        sync: false
      - key: PLATFORM_OWNER_USER_ID
        value: cmwegi3890000135nwz56w4js
      - key: STORAGE_DRIVER
        value: s3
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: aurene-uploads
      - key: R2_PUBLIC_URL
        value: https://pub-e72acd706f6e44ceb5acea9d4bc6cbde.r2.dev
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_UPLOADS_BASE_URL
        value: https://pub-e72acd706f6e44ceb5acea9d4bc6cbde.r2.dev
